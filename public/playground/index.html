<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Code Lab — Real Python 3 in your browser</title>
<meta name="description" content="Code Lab — a notebook-themed Python 3 playground. Real CPython compiled to WebAssembly via Pyodide + a CodeMirror editor. Runs 100% in your browser, no server needed.">

<!-- ========================================================================
     CODE LAB — single-file Python playground
     ------------------------------------------------------------------------
     This page is built to be embedded in a notebook-themed learning site via
     an <iframe>, but it also works perfectly when opened directly as a file.

     HOW THE PIECES FIT TOGETHER
       <head>   : Google Fonts + CodeMirror stylesheets + all page CSS (§1)
       <body>   : slim top bar (status pill + Run/Clear buttons), the editor
                  pane on TOP and the console pane BELOW it — stacked, so the
                  editor gets the full width and lots of height on any screen
       scripts  : pyodide.js (Python runtime) → CodeMirror JS (core FIRST,
                  then the Python mode, then the addons) → app script (§2–§7)

     EMBEDDING NOTES FOR THE HOST SITE
       • Wait for the { type: "pyodide-ready" } postMessage before triggering
         runs from outside the frame.
       • Push code into the editor from the host page with:
             iframe.contentWindow.postMessage(
               { type: "set-code", code: "print('hi')" }, "*")
       • If the host uses the `sandbox` attribute on the iframe, include
         `allow-scripts` (required) and `allow-modals` (needed so that
         Python's input() can open window.prompt()).
     ======================================================================== -->

<!-- Google Fonts: Caveat (handwritten headings) + Nunito (UI text) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">

<!-- CodeMirror CSS: core editor chrome + the "material-darker" dark theme.
     Loaded BEFORE our <style> block below so our overrides win any ties. -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/material-darker.min.css">

<style>
/* ============================================================
   1. LAYOUT & NOTEBOOK THEME
   A lab page taped into a paper notebook: warm paper background
   with a faint grain, ink and ballpoint-pen colours, a tall dark
   navy editor card on TOP and a ruled-paper console BELOW it.
============================================================ */

/* ---- 1a. Design tokens (the notebook palette) -------------- */
:root {
  --paper:      #f6f3ec;  /* page background — warm paper          */
  --paper-card: #fffdf8;  /* cards / buttons — paper white         */
  --ink:        #23283b;  /* ink black — headings, borders         */
  --ink-soft:   #2a3040;  /* console text                          */
  --muted:      #8a8f9d;  /* gray system lines                     */
  --blue:       #3457d5;  /* ballpoint blue — Run button, accents  */
  --blue-dark:  #2a46ad;  /* ballpoint blue — hover state          */
  --red:        #d0342c;  /* red pen — Python errors               */
  --green:      #2e7d4f;  /* green pen — "ready" state             */
  --amber:      #b8860b;  /* amber — "booting" state               */
  --navy:       #1f2433;  /* editor card background                */
  --navy-deep:  #171b28;  /* editor header strip                   */
  --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
}

/* ---- 1b. Paper background: warm cream + subtle SVG grain + soft vignette */
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; height: 100%; }
body {
  min-height: 100vh;
  color: var(--ink);
  font-family: "Nunito", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  background-color: var(--paper);
  background-image:
    /* tiny inline SVG using feTurbulence = paper grain (~5% opacity) */
    url("data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20width='160'%20height='160'%3E%3Cfilter id='n'%3E%3CfeTurbulence%20type='fractalNoise'%20baseFrequency='0.8'%20numOctaves='2'%20stitchTiles='stitch'/%3E%3CfeColorMatrix%20type='saturate'%20values='0'/%3E%3C/filter%3E%3Crect%20width='160'%20height='160'%20filter='url(%23n)'%20opacity='0.05'/%3E%3C/svg%3E"),
    /* soft light from the top + a faint vignette toward the edges */
    radial-gradient(120% 80% at 50% 0%, rgba(255, 255, 255, 0.55) 0%, rgba(255, 255, 255, 0) 55%),
    radial-gradient(140% 120% at 50% 110%, rgba(35, 40, 59, 0.06) 0%, rgba(35, 40, 59, 0) 55%);
}

/* ---- 1c. Outer wrapper: single centered column that EXACTLY fills the
     viewport (or iframe). The editor + console split whatever height is
     left after the slim top bar, so the editor is always as large as the
     screen allows and the output always stays visible below it.          */
.lab-wrap {
  max-width: 1240px;
  margin: 0 auto;
  padding: 12px 16px 16px;
  height: 100vh;               /* in an iframe, vh = the iframe height */
  display: flex;
  flex-direction: column;
}
@supports (height: 100dvh) {
  .lab-wrap { height: 100dvh; }
}

/* ---- 1d. Slim top bar: status pill LEFT, action keys RIGHT ---
     No big page title here — the host page (or the editor itself)
     already says what this is. Everything lives on one row so the
     panes below get maximum height.                               */
.topbar {
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 10px 14px;
  margin-bottom: 12px;
}
.topbar-actions { display: inline-flex; align-items: center; gap: 10px; }

/* Status pill — one element, three state classes:
     .booting  → amber dot  + CSS spinner + "Booting Python runtime…"
     .ready    → green dot  + "Python 3 · ready"
     .running  → blue pulsing dot + "Running…"
     (.error   → red dot, used only if the Pyodide CDN fails)        */
.status-pill {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 8px 14px;
  background: var(--paper-card);
  border: 1.5px solid rgba(35, 40, 59, 0.18);
  border-radius: 999px;
  box-shadow: 0 1px 3px rgba(35, 40, 59, 0.08);
  font-size: 13px;
  font-weight: 700;
  color: var(--ink-soft);
  white-space: nowrap;
}
.status-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--amber); flex: 0 0 auto; }
.status-pill.ready   .status-dot { background: var(--green); }
.status-pill.running .status-dot { background: var(--blue); animation: pill-pulse 1.1s ease-in-out infinite; }
.status-pill.error   .status-dot { background: var(--red); }
.status-spinner {
  display: none;
  width: 12px; height: 12px;
  border-radius: 50%;
  border: 2px solid rgba(184, 134, 11, 0.25);
  border-top-color: var(--amber);
  animation: spin 0.8s linear infinite;
}
.status-pill.booting .status-spinner { display: inline-block; }

@keyframes spin { to { transform: rotate(360deg); } }
@keyframes pill-pulse {
  0%, 100% { opacity: 1; transform: scale(1); }
  50%      { opacity: 0.45; transform: scale(0.8); }
}

/* ---- 1e. Action keys ---------------------------------------- */
/* Shared button base: ~44px tall, rounded, presses down on click */
.btn {
  min-height: 44px;
  padding: 0 22px;
  border-radius: 12px;
  font-family: "Nunito", sans-serif;
  font-size: 15px;
  font-weight: 800;
  letter-spacing: 0.01em;
  cursor: pointer;
  transition: background-color 0.15s ease, transform 0.06s ease, box-shadow 0.15s ease;
}
.btn:active:not(:disabled) { transform: translateY(2px); }
.btn:focus-visible { outline: 3px solid rgba(52, 87, 213, 0.35); outline-offset: 2px; }

/* Run Code — solid ballpoint blue; grayed out while disabled.
   The usage hint appears as a small ink speech bubble ON HOVER
   (there is no keyboard shortcut in this lab).                   */
.btn-run {
  position: relative;
  background: var(--blue);
  color: #ffffff;
  border: none;
  box-shadow: 0 3px 0 rgba(26, 42, 110, 0.4), 0 8px 16px rgba(52, 87, 213, 0.22);
}
.btn-run:hover:not(:disabled) { background: var(--blue-dark); }
.btn-run:disabled { background: #b7bac6; color: #f3f4f7; cursor: not-allowed; box-shadow: none; }

/* hover tooltip (pure CSS, anchored below the button so it is never
   clipped by the top edge of the viewport) */
.btn-run::after {
  content: attr(data-tip);
  position: absolute;
  top: calc(100% + 9px);
  right: 0;
  transform: translateY(-3px);
  padding: 6px 12px;
  border-radius: 9px;
  background: var(--ink);
  color: var(--paper-card);
  font-size: 12px;
  font-weight: 700;
  white-space: nowrap;
  box-shadow: 0 4px 10px rgba(35, 40, 59, 0.25);
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
  transition: opacity 0.15s ease, transform 0.15s ease, visibility 0.15s;
  z-index: 20;
}
/* the little bubble tail */
.btn-run::before {
  content: "";
  position: absolute;
  top: calc(100% + 3px);
  right: 26px;
  transform: translateY(-3px);
  border: 6px solid transparent;
  border-bottom-color: var(--ink);
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
  transition: opacity 0.15s ease, transform 0.15s ease, visibility 0.15s;
  z-index: 20;
}
.btn-run:hover:not(:disabled)::after,
.btn-run:hover:not(:disabled)::before {
  opacity: 1;
  visibility: visible;
  transform: translateY(0);
}
.btn-run:disabled::after,
.btn-run:disabled::before { display: none; }

/* Clear Output — white paper button with an ink border */
.btn-clear {
  background: var(--paper-card);
  color: var(--ink);
  border: 1.5px solid var(--ink);
  box-shadow: 0 3px 0 rgba(35, 40, 59, 0.2);
}
.btn-clear:hover { background: #f3efe3; }

/* ---- 1f. Main stack: editor on TOP, console BELOW ------------
     A vertical grid that fills the remaining height. The editor row
     gets roughly twice the console row (2fr vs 1fr), with sensible
     minimums so both stay usable on short screens.                */
.lab-stack {
  flex: 1 1 auto;
  min-height: 0;                /* let the grid shrink inside the flex column */
  display: grid;
  grid-template-columns: 1fr;   /* always one column: editor, then output */
  grid-template-rows: minmax(260px, 2.1fr) minmax(150px, 1fr);
  gap: 14px;
  align-items: stretch;
}
.lab-stack > * { min-width: 0; } /* keep panes from overflowing */

.pane {
  display: flex;
  flex-direction: column;
  border-radius: 16px;
  overflow: hidden;
}
/* Editor pane — dark navy card with a subtle outer shadow */
.pane-editor {
  background: var(--navy);
  box-shadow: 0 14px 30px rgba(35, 40, 59, 0.20), 0 3px 8px rgba(35, 40, 59, 0.12);
}
/* Console pane — light ruled-paper card */
.pane-console {
  background: var(--paper-card);
  border: 1.5px solid rgba(35, 40, 59, 0.16);
  box-shadow: 0 10px 24px rgba(35, 40, 59, 0.10);
}

/* Slim header strip shared by both panes */
.pane-head {
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  min-height: 40px;
  padding: 7px 16px;
}
.dark-head  { background: var(--navy-deep); }
.paper-head { border-bottom: 1px solid rgba(35, 40, 59, 0.12); }
.file-name {
  font-family: var(--mono);
  font-size: 11.5px;
  font-weight: 700;
  letter-spacing: 0.14em;
  text-transform: uppercase;   /* "main.py" renders as MAIN.PY */
  color: #9aa4bf;
}
.paper-file { color: rgba(35, 40, 59, 0.6); }
.head-right { display: inline-flex; align-items: center; gap: 10px; min-width: 0; }
.mono-label {
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.16em;
  color: rgba(35, 40, 59, 0.45);
  text-transform: uppercase;
}
.term-label {
  font-family: var(--mono);
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.18em;
  color: #6f7a99;
}

/* ---- 1g. CodeMirror host: pane stretches to its grid row ------ */
.editor-host { height: 100%; min-height: 260px; }
.editor-host .CodeMirror {
  height: 100%;               /* CodeMirror stretches to the pane */
  background: transparent;    /* let the navy card show through   */
  font-family: var(--mono);
  font-size: 13.5px;
  line-height: 1.6;
}
.editor-host .CodeMirror-gutters {
  background: transparent;
  border-right: 1px solid rgba(154, 164, 191, 0.16);
}

/* ---- 1h. Console: ruled paper, mono text, auto-scrolled ----- */
.console-wrap { position: relative; height: 100%; min-height: 150px; }
.console-body {
  height: 100%;
  overflow-y: auto;
  padding: 0 16px 14px;
  background-color: var(--paper-card);
  /* horizontal ruled lines every 26px — output line-height matches */
  background-image: repeating-linear-gradient(
    to bottom,
    transparent 0px,
    transparent 25px,
    rgba(52, 87, 213, 0.14) 25px,
    rgba(52, 87, 213, 0.14) 26px
  );
  background-attachment: local; /* rules scroll together with the text */
  font-family: var(--mono);
  font-size: 13px;
  line-height: 26px;
  color: var(--ink-soft);
}
/* every appended output line wraps instead of overflowing horizontally */
.console-body > div {
  white-space: pre-wrap;
  word-break: break-word;
}
.console-body .err   { color: var(--red); }   /* Python tracebacks */
.console-body .muted { color: var(--muted); } /* system messages   */
/* thin, unobtrusive scrollbar */
.console-body::-webkit-scrollbar { width: 10px; }
.console-body::-webkit-scrollbar-track { background: transparent; }
.console-body::-webkit-scrollbar-thumb {
  background: rgba(35, 40, 59, 0.18);
  border-radius: 8px;
  border: 2.5px solid transparent;
  background-clip: content-box;
}

/* ---- 1i. Boot overlay: covers the console while Pyodide loads */
.boot-overlay {
  position: absolute;
  inset: 0;
  z-index: 5;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 14px;
  padding: 20px;
  text-align: center;
  background: rgba(255, 253, 248, 0.92); /* semi-transparent over the rules */
}
.boot-overlay[hidden] { display: none !important; } /* beat the display:flex above */
.boot-spinner {
  width: 34px; height: 34px;
  border-radius: 50%;
  border: 3.5px solid rgba(52, 87, 213, 0.18);
  border-top-color: var(--blue);
  animation: spin 0.85s linear infinite;
}
.boot-text {
  margin: 0;
  max-width: 340px;
  font-size: 13.5px;
  font-weight: 700;
  color: var(--ink-soft);
}

/* ---- 1j. Responsive: keep the stack, tighten chrome on phones -- */
@media (max-width: 700px) {
  .lab-wrap { padding: 10px 12px 14px; }
  .lab-stack { grid-template-rows: minmax(230px, 1.8fr) minmax(140px, 1fr); gap: 12px; }
  .editor-host { min-height: 230px; }
  .console-wrap { min-height: 140px; }
  .btn { min-height: 42px; padding: 0 16px; font-size: 14px; }
  .status-pill { font-size: 12px; padding: 7px 12px; }
  /* let the pill and keys share the row nicely on narrow screens */
  .topbar { justify-content: center; }
}
</style>
</head>
<body>

<div class="lab-wrap">

  <!-- ====================================================================
       SLIM TOP BAR — runtime status pill on the left, Run/Clear keys on
       the right. Run is disabled (grayed) until Pyodide is ready, and
       hovering it shows a small ink tooltip instead of any shortcut hint.
  ==================================================================== -->
  <div class="topbar">
    <div class="status-pill booting" id="status-pill" role="status" aria-live="polite">
      <span class="status-spinner" aria-hidden="true"></span>
      <span class="status-dot" aria-hidden="true"></span>
      <span class="status-text" id="status-text">Booting Python runtime…</span>
    </div>

    <div class="topbar-actions">
      <button id="run-btn" class="btn btn-run" type="button" data-tip="Runs your Python code" aria-label="Run the Python code" disabled>Run Code</button>
      <button id="clear-btn" class="btn btn-clear" type="button" aria-label="Clear the console output">Clear Output</button>
    </div>
  </div>

  <!-- ====================================================================
       MAIN STACK — the editor pane on TOP and the console pane BELOW it,
       on every screen size. Both panes carry accessible labels. The boot
       overlay covers the console while the Python runtime loads.
  ==================================================================== -->
  <main class="lab-stack">

    <!-- EDITOR PANE: dark navy card, slim "main.py" header strip, CodeMirror inside -->
    <section class="pane pane-editor" aria-label="Python code editor">
      <div class="pane-head dark-head">
        <span class="file-name">main.py</span>
        <span class="head-right">
          <span class="term-label">PYTHON · WASM</span>
        </span>
      </div>
      <div class="editor-host" id="editor-host"><!-- CodeMirror mounts here --></div>
    </section>

    <!-- CONSOLE PANE: ruled-paper card. role="log" + aria-live announce new
         output to screen readers. -->
    <section class="pane pane-console" aria-label="Python console">
      <div class="pane-head paper-head">
        <span class="file-name paper-file">output</span>
        <span class="head-right mono-label">stdout · stderr</span>
      </div>
      <div class="console-wrap">
        <div class="console-body" id="console-body" role="log" aria-live="polite" aria-label="Python output console"></div>
        <div class="boot-overlay" id="boot-overlay" role="status">
          <span class="boot-spinner" aria-hidden="true"></span>
          <p class="boot-text">Loading Python runtime — first run takes a few seconds…</p>
        </div>
      </div>
    </section>

  </main>

</div>

<!-- ==========================================================================
     LIBRARY SCRIPTS (plain <script> tags — they execute in order, so by the
     time the application script below runs, both libraries are guaranteed
     to be loaded. If Pyodide's CDN is unreachable, its <script> simply fails
     and the app script's boot() reports the error gracefully.)
========================================================================== -->

<!-- Pyodide v0.26.4 — real CPython 3 compiled to WebAssembly -->
<script src="https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.js"></script>

<!-- CodeMirror 5.65.16 — core FIRST, then the Python mode, then the addons -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/python/python.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/closebrackets.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/matchbrackets.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/selection/active-line.min.js"></script>

<!-- ==========================================================================
     APPLICATION SCRIPT — everything the playground does lives here.
========================================================================== -->
<script>
(function () {
  "use strict";

  /* ------------------------------------------------------------------
     Shared DOM references & app state (used by every section below).
     ------------------------------------------------------------------ */
  var PYODIDE_INDEX_URL = "https://cdn.jsdelivr.net/pyodide/v0.26.4/full/";

  var runBtn      = document.getElementById("run-btn");       // "Run Code" button
  var clearBtn    = document.getElementById("clear-btn");     // "Clear Output" button
  var editorHost  = document.getElementById("editor-host");   // div CodeMirror mounts into
  var consoleBody = document.getElementById("console-body");  // ruled-paper output pane
  var statusPill  = document.getElementById("status-pill");   // top-bar status pill
  var statusText  = document.getElementById("status-text");   // pill text node
  var bootOverlay = document.getElementById("boot-overlay");  // "Loading Python…" overlay

  var pyodide   = null;   // Pyodide runtime instance (assigned during boot)
  var pyReady   = false;  // true once loadPyodide() has resolved
  var pyRunning = false;  // true while a user script is currently executing

  // ================= 2. CODEMIRROR EDITOR SETUP =================
  // Dark-themed editor with: Python syntax highlighting, line numbers,
  // auto-indentation (indentUnit 4), bracket matching + auto-closing
  // and active-line highlighting. Plain buttons only — no shortcuts.
  var STARTER_CODE = `# ============================================
#  Welcome to the Code Lab!
#  Real Python 3 running in your browser
#  (Pyodide + WebAssembly — no server needed)
# ============================================

name = "PyDaily"        # a string variable
days = 100              # an integer variable

print("Hello, World!")
print(f"Welcome to {name} — {days} days of Python!")

# a loop
for day in range(1, 6):
    print(f"Day {day}: keep the streak alive!")

# some math
import math

print("The square root of 144 is", math.sqrt(144))
print("The sum of 1..100 is", sum(range(1, 101)))

# Bonus: this lesson uses input() via a browser popup.
# Uncomment the two lines below and press Run!
# your_name = input("What is your name? ")
# print("Nice to meet you,", your_name)
`;

  var editor = CodeMirror(editorHost, {
    value: STARTER_CODE,          // pre-filled "Hello, World!" script
    mode: "python",               // syntax highlighting (mode loaded above)
    theme: "material-darker",     // dark theme (CSS loaded above)
    lineNumbers: true,
    indentUnit: 4,                // Python-style 4-space indentation
    matchBrackets: true,
    autoCloseBrackets: true,
    styleActiveLine: true
  });

  // ================= 3. PYODIDE PYTHON RUNTIME =================
  // Boot sequence (runs on window load):
  //   1. show the loading indicator + spinner pill, disable "Run Code"
  //   2. await loadPyodide(...)  ← downloads CPython→WASM (a few seconds)
  //   3. redirect stdout/stderr into the console pane (BEFORE user code runs)
  //   4. install the input() → window.prompt() override (section 5)
  //   5. mark ready: enable the button, flip the pill to "Python 3 · ready",
  //      hide the overlay, and notify the host page (if embedded in an iframe)
  // If the CDN fails, the catch block keeps the page alive and explains
  // the problem in red inside the console pane.
  function bootPyodide() {
    bootOverlay.hidden = false;   // loading indicator over the console
    runBtn.disabled = true;       // no running code until ready
    setStatus("booting");         // pill: spinner + amber dot

    try {
      // Guard: pyodide.js may not have loaded (offline / blocked CDN).
      if (typeof loadPyodide !== "function") {
        throw new Error("loadPyodide() not found — the Pyodide CDN script did not load.");
      }

      loadPyodide({ indexURL: PYODIDE_INDEX_URL })
        .then(function (py) {
          pyodide = py;

          // Redirect Python's stdout/stderr to the console pane.
          // `batched` fires once per complete line of output.
          pyodide.setStdout({ batched: function (s) { appendOutput(s + "\n", "out"); } });
          pyodide.setStderr({ batched: function (s) { appendOutput(s + "\n", "err"); } });

          // Python's input() opens a browser prompt (section 5).
          installInputOverride();

          pyReady = true;
          bootOverlay.hidden = true;    // hide the loading indicator
          runBtn.disabled = false;      // enable "Run Code"
          setStatus("ready");           // pill: green "Python 3 · ready"
          appendOutput("Python runtime ready — press Run Code to execute main.py.\n", "muted");

          notifyHostReady();            // postMessage to the host page
        })
        .catch(function (err) {
          bootOverlay.hidden = true;
          setStatus("error");           // pill: red dot (CDN failure)
          appendOutput("Could not load the Python runtime — check your internet connection.\n", "err");
          console.error("[Code Lab] Failed to boot Pyodide:", err);
        });
    } catch (err) {
      // Same failure path, for the synchronous typeof guard above.
      bootOverlay.hidden = true;
      setStatus("error");
      appendOutput("Could not load the Python runtime — check your internet connection.\n", "err");
      console.error("[Code Lab] Failed to boot Pyodide:", err);
    }
  }

  // ================= 4. OUTPUT HANDLING (stdout/stderr) =================
  // appendOutput(text, cls) is the single gateway for everything that
  // appears in the console pane. Class names map to colors:
  //   "out"   → default ink      (print output / stdout)
  //   "err"   → red pen          (tracebacks / stderr)
  //   "muted" → gray             (system messages)
  // We use textContent (never innerHTML) so Python output can never
  // inject HTML into the page, and we auto-scroll to the newest line.
  function appendOutput(text, cls) {
    var line = document.createElement("div");
    line.className = cls || "out";
    line.textContent = text;
    consoleBody.appendChild(line);
    consoleBody.scrollTop = consoleBody.scrollHeight; // auto-scroll
  }

  // clearOutput() empties the console pane (also called before each run).
  function clearOutput() {
    consoleBody.textContent = "";
  }

  // ================= 5. INPUT() VIA WINDOW.PROMPT =================
  // Python's built-in input() blocks on stdin, which does not exist in a
  // browser — so after boot we override it with a small Python shim that
  // calls window.prompt() instead. Cancelling the prompt raises EOFError
  // (shown as a red traceback), which is exactly what real Python does on
  // an EOF. The override is wrapped in try/except-equivalent so a failure
  // here can NEVER block the boot sequence.
  var INPUT_OVERRIDE_PY = `
import builtins, js

def _input(prompt=""):
    reply = js.window.prompt(str(prompt))
    if reply is None:
        raise EOFError("input() cancelled")
    return str(reply)

builtins.input = _input
`;

  function installInputOverride() {
    try {
      pyodide.runPython(INPUT_OVERRIDE_PY);
    } catch (err) {
      // input() simply keeps its default behavior if this fails.
      console.warn("[Code Lab] Could not install input() override:", err);
    }
  }

  // ================= 6. RUN / CLEAR / STATUS =================
  // setStatus(state) drives the status pill through its states:
  //   booting → "Booting Python runtime…" (spinner + amber dot)
  //   ready   → "Python 3 · ready"        (green dot)
  //   running → "Running…"                (blue pulsing dot)
  //   error   → "Python failed to load"   (red dot, CDN failure only)
  function setStatus(state) {
    statusPill.classList.remove("booting", "ready", "running", "error");
    statusPill.classList.add(state);
    statusText.textContent = {
      booting: "Booting Python runtime…",
      ready:   "Python 3 · ready",
      running: "Running…",
      error:   "Python failed to load"
    }[state];
  }

  // runCode() executes the editor's Python code:
  //   • ignored when the runtime is not ready or a run is already active
  //   • clears the console, prints a muted "▸ run started"
  //   • awaits pyodide.runPythonAsync(code); any Python traceback arrives
  //     as err.message and is printed in RED without crashing the page
  //   • a `finally` block always restores the UI state (muted "▸ run
  //     finished", button re-enabled, pill back to "Python 3 · ready")
  function runCode() {
    if (!pyReady || pyRunning || !pyodide) { return; } // do nothing if not ready/busy
    pyRunning = true;
    runBtn.disabled = true;
    setStatus("running");

    clearOutput();                          // fresh console for each run
    appendOutput("\u25B8 run started\n", "muted");

    var code = editor.getValue();
    pyodide.runPythonAsync(code)
      .catch(function (err) {
        appendOutput((err && err.message ? err.message : String(err)) + "\n", "err");
      })
      .then(function () {
        // `finally` equivalent: always runs, success or failure.
        pyRunning = false;
        appendOutput("\u25B8 run finished\n", "muted");
        if (pyReady) {
          runBtn.disabled = false;
          setStatus("ready");
        }
      });
  }

  // Wire up the toolbar buttons.
  runBtn.addEventListener("click", runCode);
  clearBtn.addEventListener("click", clearOutput);

  // ================= 7. CROSS-FRAME API (set-code) =================
  // When embedded in an iframe, the host notebook site can push code into
  // the editor by posting a message:
  //     iframe.contentWindow.postMessage({ type: "set-code", code: "..." }, "*")
  // This listener is harmless when the page is opened standalone (no
  // messages ever arrive).
  window.addEventListener("message", function (event) {
    if (event.data && event.data.type === "set-code") {
      editor.setValue(String(event.data.code ?? ""));
    }
  });

  // Once Pyodide is ready, tell the host page we can accept code / runs.
  // When standalone, window.parent is this same window — posting to
  // ourselves is harmless (the listener above only reacts to "set-code").
  function notifyHostReady() {
    try {
      window.parent.postMessage({ type: "pyodide-ready" }, "*");
    } catch (err) { /* ignore — standalone page or restricted sandbox */ }
  }

  /* ------------------------------------------------------------------
     Kick off the boot sequence when the page has fully loaded.
     ------------------------------------------------------------------ */
  if (document.readyState === "complete") {
    bootPyodide();
  } else {
    window.addEventListener("load", bootPyodide);
  }
})();
</script>

</body>
</html>
